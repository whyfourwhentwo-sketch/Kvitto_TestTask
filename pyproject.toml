[project]
name = "test-task"
version = "0.1.0"
description = "Тестовое задание на Квитто"
authors = [
    {name = "Роман Лепик"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.146.0,<0.147.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic (>=2)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]